version: 1
sensitivity_values: [public, internal, confidential, secret]
retention_values: [ephemeral, standard, audit]
events:
  - id: SessionCreated
    version: 1
    category: session
    default_sensitivity: internal
    default_retention: standard
    stream_key: session/<session-id>
    produced_by: CreateSession
  - id: AgentSpecRevisionStored
    version: 1
    category: session
    default_sensitivity: internal
    default_retention: audit
    stream_key: config/global
    produced_by: PutAgentSpecRevision
  - id: TaskCreated
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: task/<task-id>
    produced_by: CreateTaskRun
  - id: RunCreated
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: CreateTaskRun
  - id: RunReady
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: BindRun
  - id: RunBound
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: BindRun
  - id: RunStarted
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: ClaimReadyRun
  - id: RunWaitingTool
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: RunWaitingChild
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: RunWaitingHuman
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: RunStateChanged
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: RunStateTransition
  - id: RunCompleted
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: RunFailed
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: RunCancelled
    version: 1
    category: runtime
    default_sensitivity: internal
    default_retention: audit
    stream_key: run/<run-id>
    produced_by: CancelRun
  - id: ChildRunCreated
    version: 1
    category: graph
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<parent-run-id>
    produced_by: CreateTaskRun
  - id: DependencyAdded
    version: 1
    category: graph
    default_sensitivity: internal
    default_retention: standard
    stream_key: task/<task-id>
    produced_by: AddRunDependency
  - id: RunClaimed
    version: 1
    category: graph
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: ClaimReadyRun
  - id: CancellationEpochAdvanced
    version: 1
    category: graph
    default_sensitivity: internal
    default_retention: audit
    stream_key: run/<run-id>
    produced_by: CancelRun
  - id: LoopTurnIssued
    version: 1
    category: loop
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
