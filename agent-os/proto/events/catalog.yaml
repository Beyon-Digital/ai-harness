    version: 1
    category: loop
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: LoopDecisionRejectedStale
    version: 1
    category: loop
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: SubmitLoopDecision
  - id: EffectPrepared
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: standard
    stream_key: effect/<effect-id>
    produced_by: prepare_effect
  - id: EffectClaimed
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: standard
    stream_key: effect/<effect-id>
    produced_by: "Prepared -> Claimed"
  - id: EffectDispatched
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: standard
    stream_key: effect/<effect-id>
    produced_by: "Claimed -> Dispatched"
  - id: EffectAcknowledged
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: standard
    stream_key: effect/<effect-id>
    produced_by: "Dispatched -> Acknowledged"
  - id: EffectCommitted
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: audit
    stream_key: effect/<effect-id>
    produced_by: "Acknowledged -> Committed"
  - id: EffectFailed
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: audit
    stream_key: effect/<effect-id>
    produced_by: "Dispatched|Acknowledged -> Failed"
  - id: EffectCancelled
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: audit
    stream_key: effect/<effect-id>
    produced_by: "Dispatched -> Cancelled"
  - id: EffectUnknown
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: audit
    stream_key: effect/<effect-id>
    produced_by: "Dispatched -> Unknown"
  - id: EffectReconciled
    version: 1
    category: effect
    default_sensitivity: internal
    default_retention: audit
    stream_key: effect/<effect-id>
    produced_by: ResolveUnknownEffect
  - id: TimerScheduled
    version: 1
    category: timer
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: ScheduleTimer
  - id: TimerClaimed
    version: 1
    category: timer
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: "Scheduled -> Claimed"
  - id: TimerFired
    version: 1
    category: timer
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: "Claimed -> Fired"
  - id: TimerCancelled
    version: 1
    category: timer
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
    produced_by: "Scheduled -> Cancelled"
  - id: ResourceReserved
    version: 1
    category: resource
    default_sensitivity: internal
    default_retention: standard
    stream_key: run/<run-id>
