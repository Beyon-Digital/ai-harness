schema_version: 1

kernel:
  store: sqlite-kernel
  daemon_identity: local-mac

services:
  event_journal: sqlite-events
  message_queue: memory-queue
  secret_store: macos-keychain
  transport: local-uds

profiles:
  local-trusted:
    sandbox: local-process-t0
    workspace: local-workspace
    artifact_store: local-artifacts
    # Real-LLM loop adapter (fixtures/openrouter-loop) + real-LLM effect
    # adapter (fixtures/openrouter-effect): model calls flow through the
    # Effect Coordinator as durable `model.chat` effects. Requires
    # OPENROUTER_API_KEY in the agentd environment.
    agent_loop: 01905c5e-0000-7000-8000-11a7c3d90001@1
    effect_execute: 01905c5e-0000-7000-8000-11a7c3d90002@1

  # LLM agent + custom wasm plugin: openrouter-loop drives the agent;
  # `effect.execute` resolves to the WASI adapter (wasm.echo) instead of
  # a model call — proves a custom agent can run a custom wasm plugin.
  openrouter-wasm:
    sandbox: local-process-t0
    workspace: local-workspace
    artifact_store: local-artifacts
    agent_loop: 01905c5e-0000-7000-8000-11a7c3d90001@1
    effect_execute: 01905c5e-0000-7000-8000-00000000e001@1

  local-wasm:
    sandbox: local-process-t0
    workspace: local-workspace
    artifact_store: local-artifacts
    agent_loop: fixture-loop
    effect_execute: 01905c5e-0000-7000-8000-00000000e001@1

policies:
  sandbox:
    minimum_untrusted_tier: T2_UNTRUSTED
  effects:
    unknown_default: require_human_decision

limits:
  queue:
    capacity_messages: 1024
  adapters:
    max_frame_bytes: 4194304
    handshake_timeout_ms: 5000
    request_deadline_ms: 60000
    health_ping_ms: 10000
    health_missed_allowed: 3
    supervisor_max_restarts: 5
    supervisor_backoff_initial_ms: 100
    supervisor_backoff_max_ms: 10000
  effects:
    lease_ms: 30000
    lease_renew_ms: 10000
  runs:
    claim_ttl_ms: 30000
  daemon:
    fence_lease_ms: 15000
    fence_renew_ms: 5000
  approvals:
    ttl_ms: 900000
  shutdown:
    drain_deadline_ms: 30000
  events:
    live_buffer_events: 256
    dispatcher_poll_ms: 500
    scheduler_poll_ms: 1000
  streams:
    read_default_limit: 100
    read_max_limit: 1000
  fs:
    db_file_mode: "0600"
    runtime_dir_mode: "0700"
    control_socket_mode: "0600"
  context:
    max_state_bytes: 65536
    max_fed_events: 64
    max_fed_event_bytes: 65536

observability:
  log_level: info
