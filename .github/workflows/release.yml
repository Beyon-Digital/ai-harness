name: release

# Tag pushes (`v*`) publish a GitHub Release; every merge to `main`
# refreshes the rolling `dev-latest` prerelease — both carry the macOS /
# Linux / Windows desktop installers and the CLI tarballs. PRs touching
# the desktop app run the same matrix build-only so the pipeline stays
# continuously validated; manual dispatches opt into publishing via the
# `publish` input.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "agent-os/**"
      - "contracts/**"
      - "docs/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish artifacts to the dev-latest release
        type: boolean
        default: false

# One run per ref — rapid merges queue rather than race the publish job.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || inputs.publish }}
  RELEASE_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.ref == 'refs/heads/main' && 'dev-latest' || format('dev-{0}', github.sha)) }}

jobs:
  desktop:
    name: Desktop bundle (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64, os: ubuntu-22.04 }
          - { label: windows-x86_64, os: windows-latest }
          - { label: macos-arm64, os: macos-14 }
          - { label: macos-x86_64, os: macos-15-intel }
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust (repo-pinned channel)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94.0"
          targets: wasm32-wasip1
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            agent-os
            apps/desktop/src-tauri
      - name: Linux webview/build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev libssl-dev libfuse2 file \
            xdotool imagemagick
      - name: Install JS deps
        run: npm ci
      - name: Require Apple signing credentials for stable releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD; do
            test -n "${!name}" || { echo "::error::$name is required"; exit 1; }
          done
      - name: Import Apple Developer ID certificate + App Store Connect key
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          echo "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
      - name: Require Windows signing credentials for stable releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { throw "WINDOWS_CERTIFICATE is required" }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw "WINDOWS_CERTIFICATE_PASSWORD is required" }
      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw "certificate import failed" }
          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 | Out-File src-tauri/tauri.windows.conf.json -Encoding utf8
      - name: Build + stage embedded runtime (Unix sidecars)
        if: runner.os != 'Windows'
        run: |
          triple=$(rustc -vV | awk '/^host:/{print $2}')
          cd "$GITHUB_WORKSPACE/agent-os"
          cargo build --release --target "$triple" \
            -p agentd -p agentgw -p wasm-host \
            -p local-memory -p openrouter-loop -p openrouter-effect \
            -p acp-loop -p fixture-agent-loop -p fixture-effect-adapter \
            -p computer-mcp
          cargo build --release --target wasm32-wasip1 -p wasm-echo
          "$GITHUB_WORKSPACE/apps/desktop/scripts/stage-embedded-runtime.sh" "$triple"
      - name: Build bundles (self-contained app)
        if: runner.os != 'Windows'
        # Finder-AppleScript DMG styling times out on headless CI;
        # respecting CI skips it (slightly plainer DMG layout).
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: false
          APPLE_SIGNING_IDENTITY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "$GITHUB_REF" != refs/tags/v* ]]; then
            unset APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            npm run build:embedded -- --bundles deb
          else
            npm run build:embedded
          fi
      - name: Build bundles (remote-gateway shell)
        if: runner.os == 'Windows'
        run: npm run build
      - name: Upload bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: apps/desktop/src-tauri/target/release/bundle/**

  cli:
    name: CLI binaries (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # agentd/agentgw use Unix sockets — no Windows CLI build. The
        # Windows desktop app connects to a remote gateway instead.
        include:
          - { label: linux-x86_64, os: ubuntu-22.04 }
          - { label: macos-arm64, os: macos-14 }
          - { label: macos-x86_64, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (repo-pinned channel)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.94.0"
          targets: wasm32-wasip1
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-os
      - name: Build CLI binaries + wasm plugin
        working-directory: agent-os
        run: |
          cargo build --release \
            -p agentd -p agentctl -p agentgw -p wasm-host \
            -p local-memory -p openrouter-loop -p openrouter-effect -p acp-loop \
            -p fixture-agent-loop -p fixture-effect-adapter -p computer-mcp
          cargo build --release -p wasm-echo --target wasm32-wasip1
      - name: Stage archive
        run: |
          set -euo pipefail
          pkg="agentos-${{ env.RELEASE_NAME }}-${{ matrix.label }}"
          mkdir -p "dist/$pkg/bin" "dist/$pkg/share/manifests" "dist/$pkg/share/bundles"
          cp agent-os/target/release/{agentd,agentctl,agentgw,agentos-wasm-host,local-memory,openrouter-loop,openrouter-effect,acp-loop,fixture-agent-loop,fixture-effect-adapter,computer-mcp} \
             "dist/$pkg/bin/"
          cp agent-os/target/wasm32-wasip1/release/wasm-echo.wasm "dist/$pkg/bin/"
          cp agent-os/scripts/make-adapter-bundle.sh "dist/$pkg/bin/"
          cp agent-os/config/*.yaml "dist/$pkg/share/"
          # Ship ready-to-install bundle directories (manifest + binary +
          # bundle.lock) under share/bundles/<adapter>/ — `agentd adapter
          # install` consumes them directly.
          for m in agent-os/fixtures/*/adapter.manifest.json; do
            name=$(basename "$(dirname "$m")")
            cp "$m" "dist/$pkg/share/manifests/$name.manifest.json"
            entrypoint=$(sed -n 's/.*"entrypoint" *: *"\([^"]*\)".*/\1/p' "$m" | head -1)
            src="agent-os/target/release/$entrypoint"
            [ -f "$src" ] || src="agent-os/target/wasm32-wasip1/release/$entrypoint"
            [ -f "$src" ] || { echo "missing entrypoint binary for $name: $entrypoint"; exit 1; }
            agent-os/scripts/make-adapter-bundle.sh "$src" "$m" "dist/$pkg/share/bundles/$name"
          done
          cp docs/guides/web-gui-and-llm-adapter.md "dist/$pkg/share/"
          cd dist && tar -czf "$pkg.tar.gz" "$pkg" && mv "$pkg.tar.gz" ..
      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: agentos-${{ env.RELEASE_NAME }}-${{ matrix.label }}.tar.gz

  # One publish job owns the release — parallel matrix jobs calling a
  # release action can race on release creation and attach subsets.
  # `env` is not a valid context in a job-level `if` (workflow env vars
  # aren't evaluated there), so the release predicate is inlined.
  publish:
    name: Publish release
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || inputs.publish }}
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Rolling-channel assets get a per-attempt suffix so an upload can
      # never overwrite the live set — even a rerun of the same commit
      # uses fresh names. Post-upload cleanup then drops every asset
      # whose name isn't in this build's set.
      - name: Suffix dev assets and record expected names
        if: ${{ env.RELEASE_NAME == 'dev-latest' }}
        working-directory: artifacts
        run: |
          suffix="dev.${GITHUB_SHA:0:8}.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          find . -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.tar.gz' \) -print0 |
          while IFS= read -r -d '' f; do
            base=$(basename "$f")
            case "$base" in
              *.tar.gz) new="${base%.tar.gz}-${suffix}.tar.gz" ;;
              *)        new="${base%.*}-${suffix}.${base##*.}" ;;
            esac
            mv "$f" "$(dirname "$f")/$new"
            printf '%s\n' "$new" >> "$RUNNER_TEMP/expected-assets.txt"
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0
      - name: Sign release artifacts with GitHub OIDC
        working-directory: artifacts
        env:
          COSIGN_YES: "true"
        run: |
          find . -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.rpm' -o -name '*.msi' -o -name '*.exe' -o -name '*.tar.gz' \) -print0 |
          while IFS= read -r -d '' file; do
            cosign sign-blob --bundle "$file.sigstore.json" "$file"
            if [ "${{ env.RELEASE_NAME }}" = "dev-latest" ]; then
              basename "$file.sigstore.json" >> "$RUNNER_TEMP/expected-assets.txt"
            fi
          done
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_NAME }}
          name: "Agent OS ${{ env.RELEASE_NAME }}"
          draft: false
          prerelease: ${{ contains(env.RELEASE_NAME, '-') }}
          generate_release_notes: true
          # Curated installables only — download-artifact strips the
          # `bundle` common root, and a recursive glob would attach the
          # raw contents of bundle dirs (hundreds of files inside .app).
          files: |
            artifacts/cli-*/agentos-*.tar.gz
            artifacts/desktop-*/dmg/*.dmg
            artifacts/desktop-*/appimage/*.AppImage
            artifacts/desktop-*/deb/*.deb
            artifacts/desktop-*/rpm/*.rpm
            artifacts/desktop-*/msi/*.msi
            artifacts/desktop-*/nsis/*.exe
            artifacts/**/*.sigstore.json
          body: |
            Desktop installers plus CLI binaries (agentd / agentctl /
            agentgw / agentos-wasm-host and the bundled adapters).

            The macOS and Linux desktop apps are self-contained: they
            spawn the embedded `agentd` + `agentgw` and adapter bundles
            at launch, then open the dashboard — no terminal steps. The
            Windows build runs in remote-gateway mode: start `agentd` +
            `agentgw` first (see docs/guides/web-gui-and-llm-adapter.md)
            or set AGENTOS_GATEWAY to a reachable gateway URL.

            Stable releases are signed with Apple Developer ID and
            notarized via an App Store Connect API key on macOS, and
            Authenticode on Windows. Every
            published asset includes a keyless Sigstore bundle
            (`.sigstore.json`) for identity-based verification.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Move the rolling tag once the full new set is uploaded — before
      # pruning — so a failure here leaves the old tag pointing at its
      # still-intact asset set (plus stray new files the next run prunes).
      - name: Point the dev-latest tag at this commit
        if: ${{ env.RELEASE_NAME == 'dev-latest' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'tags/dev-latest', sha: context.sha, force: true });
            } catch {
              await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: 'refs/tags/dev-latest', sha: context.sha });
            }
      # Cleanup runs last, after the tag has moved: remove release assets
      # whose names aren't in this build's set — files from older commits
      # or failed earlier attempts can't linger. The tagged commit's set
      # is always complete at this point.
      - name: Remove obsolete dev-latest assets
        if: ${{ env.RELEASE_NAME == 'dev-latest' }}
        uses: actions/github-script@v7
        with:
          script: |
            // GitHub normalizes asset `name` (spaces become dots), while the
            // release action restores the original filename as `label` —
            // match either, or every spaced filename looks "obsolete".
            const expected = new Set(require('fs').readFileSync(`${process.env.RUNNER_TEMP}/expected-assets.txt`, 'utf8').split('\n').filter(Boolean));
            const rel = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag: 'dev-latest' });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner: context.repo.owner, repo: context.repo.repo, release_id: rel.data.id, per_page: 100 });
            for (const asset of assets) {
              if (!expected.has(asset.name) && !expected.has(asset.label)) {
                await github.rest.repos.deleteReleaseAsset({ owner: context.repo.owner, repo: context.repo.repo, asset_id: asset.id });
              }
            }
