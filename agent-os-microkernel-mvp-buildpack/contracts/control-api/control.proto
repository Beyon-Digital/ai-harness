syntax="proto3"; package agentos.spec.v1;
service ControlApi {
  rpc SubmitCommand(CommandRequest) returns (CommandResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetEffect(GetEffectRequest) returns (GetEffectResponse);
  rpc RespondApproval(ApprovalResponseRequest) returns (ApprovalResponseResult);
}
message CommandRequest { string command_id=1; string idempotency_key=2; string actor_id=3; string request_digest=4; string command_type=5; bytes payload=6; }
message CommandResponse { string command_id=1; string outcome_code=2; bytes payload=3; }
message GetRunRequest { string run_id=1; } message GetRunResponse { bytes run=1; }
message GetEffectRequest { string effect_id=1; } message GetEffectResponse { bytes effect=1; }
message ApprovalResponseRequest { string request_id=1; string request_digest=2; string decision=3; string device_id=4; }
message ApprovalResponseResult { string status=1; }
