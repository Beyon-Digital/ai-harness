syntax="proto3"; package agentos.spec.v1; import "ports/common.proto";
service SecretStorePort { rpc Metadata(SecretRefRequest) returns (GenericResult); rpc ResolveForBroker(SecretRefRequest) returns (SecretMaterial); rpc Rotate(SecretRotateRequest) returns (GenericResult); rpc Revoke(SecretRefRequest) returns (GenericResult); }
message SecretRefRequest { ExecutionContext context=1; string secret_uri=2; }
message SecretMaterial { bytes material=1; string secret_version=2; }
message SecretRotateRequest { ExecutionContext context=1; string secret_uri=2; bytes new_material=3; }
