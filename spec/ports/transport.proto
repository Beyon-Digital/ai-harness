syntax="proto3"; package agentos.spec.v1; import "ports/common.proto";
service TransportPort { rpc Connect(TransportConnectRequest) returns (TransportChannel); rpc Send(TransportSendRequest) returns (GenericResult); rpc Health(TransportChannelRequest) returns (GenericResult); rpc Close(TransportChannelRequest) returns (GenericResult); }
message TransportConnectRequest { ExecutionContext context=1; string endpoint=2; bytes auth_context_json=3; }
message TransportChannel { string channel_id=1; bytes capabilities_json=2; }
message TransportSendRequest { ExecutionContext context=1; string channel_id=2; string frame_id=3; bytes payload=4; }
message TransportChannelRequest { ExecutionContext context=1; string channel_id=2; }
